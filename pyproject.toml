[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "household-bench-eval"
version = "1.0.0"
description = "HouseholdBench: scoring package and dataset construction pipeline."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Jin Huang"},
    {name = "Diego Ferreras Garrucho"},
    {name = "Yutong Xie"},
    {name = "Walter M. Yuan"},
    {name = "Qiaozhu Mei"},
    {name = "Chen Lian"},
    {name = "Jonathon Hazell"},
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# Rebuilding the benchmark from raw survey files (scripts/). Pins the library
# versions used to build the released files.
pipeline = [
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pyarrow==18.1.0",
    "scikit-learn==1.6.1",
    "scipy==1.18.0",
    "xgboost==3.3.0",
]

[project.urls]
Homepage = "https://jn-huang.github.io/householdbench"
Repository = "https://github.com/Jn-Huang/householdbench_eval"
"Evaluation sample" = "https://huggingface.co/datasets/householdbench/householdbench-eval"
"Full dataset" = "https://huggingface.co/datasets/householdbench/householdbench-full"

[project.scripts]
household-bench-eval = "household_bench_eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
